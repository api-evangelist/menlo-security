name: Menlo Security
description: >-
  Menlo Security provides a cloud-delivered Browser Security Platform that protects
  enterprises and their AI agents at the browser session layer, where most modern
  attacks and data loss occur. Its core capabilities include pre-render threat
  prevention using multimodal visual and DOM analysis, patented Positive Selection
  file security that reconstructs documents to strip malware and macros, AI Adaptive
  DLP for real-time detection and masking of PII/PHI and financial data, invisible
  browser isolation for high-risk activity, and Menlo Secure Application Access for
  identity-based zero-trust access to SaaS, legacy, and private applications for both
  human users and autonomous agents. The platform integrates with existing SASE/SSE,
  EDR/EPP, and SOC tooling through a single unified control plane. Menlo Security is
  privately held and backed by investors including General Catalyst. The company
  operates primarily as an enterprise security vendor and does not publish a public
  developer API program; administrative and reporting APIs are available to customers
  through the authenticated admin console.
